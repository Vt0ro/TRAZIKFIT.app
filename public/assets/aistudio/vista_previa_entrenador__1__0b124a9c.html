chUid == c\n        && get(/databases/$(database)/documents/invites/$(c + '_' + myEmail())).data.to == myEmail()\n        && isTrainerUid(c);\n    }\n    // El atleta solo puede AGREGAR un entrenador si existe una invitaci\u00f3n v\u00e1lida (quitar siempre se permite).\n    function coachesOk() {\n      let nc = request.resource.data.get('coaches', []);\n      let oc = resource.data.get('coaches', []);\n      let added = nc.toSet().difference(oc.toSet());\n      return added.size() == 0\n        || (added.size() == 1 && nc.size() > 0\n            && added.hasAny([nc[nc.size() - 1]].toSet())\n            && inviteOk(nc[nc.size() - 1]));\n    }\n\n    // ---------- Datos de cada usuario ----------\n    match /users/{uid} {\n      allow get, list: if signedIn() && (\n        request.auth.uid == uid\n        || (isTrainer() && request.auth.uid in resource.data.coaches)\n        || isAdmin());\n\n      // Al crear su documento, coaches debe ir vac\u00edo.\n      allow create: if signedIn() && request.auth.uid == uid\n        && request.resource.data.coaches.size() == 0;\n\n      allow update: if signedIn() && (\n        (request.auth.uid == uid && coachesOk())\n        || (isTrainer() && request.auth.uid in resource.data.coaches\n            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['cplans', 'cts'])));\n\n      match /sessions/{sid} {\n        allow get, list: if signedIn() && (\n          request.auth.uid == uid\n          || (isTrainer() && linked(uid))\n          || isAdmin());\n        // El administrador lee todo pero no escribe datos de atletas ajenos.\n        allow create, update, delete: if signedIn() && (\n          request.auth.uid == uid\n          || (isTrainer() && linked(uid)));\n      }\n    }\n\n    // ---------- Invitaciones ----------\n    match /invites/{id} {\n      // Solo un entrenador puede invitar; el ID debe ser {suUID}_{correo en min\u00fasculas}.\n      allow create: if signedIn() && isTrainer()\n        && request async function wlOn(){try{if(navigator.wakeLock&&IV&&!IV.wl){IV.wl=await navigator.wakeLock.request('screen');IV.wl.addEventListener('release',()=>{if(IV)IV.wl=null})}}catch(e){}}

function ivCfg(){S.iv=S.iv||{};S.iv.cfg=S.iv.cfg||{};if(!IVN[S.iv.m])S.iv.m='tabata';const m=S.iv.m,o=S.iv.cfg[m]||(S.iv.cfg[m]={});for(const k in IVDEF[m])if(o[k]===undefined)o[k]=IVDEF[m][k];return o}
function ivPlan(){const m=S.iv.m,c=ivCfg(),P=[],prep=ivNum(c.prep,0,120),R=ivNum(c.rounds,1,200);if(prep>0)P.push({k:'prep',d:prep,r:0});
if(m==='emom'){const L=ivNum(c.ei,5,3600),W=ivNum(c.ew,0,L);for(let r=1;r<=R;r++){if(W>0&&W<L){P.push({k:'work',d:W,r});P.push({k:'rest',d:L-W,r})}else P.push({k:'work',d:L,r})}}

const ivSum=()=>{const P=ivPlan(),t=P.reduce((a,p)=>a+p.d,0),R=ivNum(ivCfg().rounds,1,200);return'Total '+fm(t)+' · '+R+' rondas'};
const ivEl=()=>IV?IV.acc+(IV.running?(Date.now()-IV.st)/1000:0):0;
const ivIdx=e=>{for(let i=0;i<IV.plan.length;i++)if(e<IV.cum[i+1])return i;return IV.plan.length-1};
const ivMini=()=>IV&&IV.mode==='run'&&IV.running&&S.view!=='int'?`<button class="ivchip" data-gv="int">⏱ <span id="iv-mini">${fm(Math.max(0,IV.total-ivEl()))}</span></button>`:'';
const ivFlash=()=>{const el=document.getElementById('iv-scr');if(el){el.classList.add('ivfl');setTimeout(()=>el.classList.remove('ivfl'),700)}};
function ivStart(){unlock();const plan=ivPlan(),cum=[0];plan.forEach(p=>cum.push(cum[cum.length-1]+p.d));IV={mode:'run',m:S.iv.m,plan,cum,total:cum[cum.length-1],acc:0,st:Date.now(),running:true,done:false,last:-1,sec:-1,wl:null};wlOn()}
function ivFinish(){if(!IV)return;IV.acc=IV.total;IV.running=false;IV.done=true;wlOff();ivAlarm('end');if(S.view==='int'){render();ivFlash()}}
function ivAct(a){unlock();if(!IV)return;const now=Date.now();
if(a==='p'){if(IV.done){ivStart();return}if(IV.running){IV.acc=ivEl();IV.running=false;wlOff()}else{IV.st=now;IV.running=true;wlOn()}}
else if(a==='r'){IV.acc=0;IV.running=false;IV.done=false;IV.last=-1;IV.sec=-1;wlOff()}
else if(a==='x'){ivStart()}
else if(a==='c'){wlOff();IV=null}
else if(a==='n'||a==='b'){const e=ivEl(),i=ivIdx(e);let t;if(a==='n')t=IV.cum[i+1];else t=(e-IV.cum[i]>2)?IV.cum[i]:IV.cum[Math.max(0,i-1)];if(t>=IV.total){ivFinish();return}IV.acc=t;IV.st=now;IV.sec=-1;IV.last=-1}}
function ivTick(){if(!IV||IV.mode!=='run'||!IV.running)return;const e=ivEl();if(e>=IV.total){ivFinish();return}
const i=ivIdx(e);if(i!==IV.last){const prev=IV.last,ph=IV.plan[i];IV.last=i;IV.sec=-1;if(prev>=0||ph.k!=='prep')ivAlarm(ph.k);if(S.view==='int'){render();ivFlash()}return}

const g=id=>document.getElementById(id);if(g('iv-d')){g('iv-d').textContent=fm(sec);g('iv-pb').style.width=Math.min(100,(e-IV.cum[i])/IV.plan[i].d*100)+'%';g('iv-el').textContent=fm(e);g('iv-rm').textContent=fm(Math.max(0,IV.total-e))}

setInterval(ivTick,100);
const ivRow=(k,l,suf)=>{const c=ivCfg(),st=k==='rounds'?1:5;return`<div class="ivr"><span class="ivl">${l}<small>${suf}</small></span><button class="ivb" data-ivs="${k},-${st}" aria-label="Menos">−</button><input class="in ivi" inputmode="numeric" data-ivi="${k}" value="${c[k]}"><button class="ivb" data-ivs="${k},${st}" aria-label="Más">+</button></div>`};

<div class="grp pad ivinfo"><div><small>TRANSCURRIDO</small><b id="iv-el">${fm(Math.min(e,IV.total))}</b></div><div><small>RESTANTE</small><b id="iv-rm">${fm(Math.max(0,IV.total-e))}</b></div></div>
${done?'<button class="pri ivgo" data-ivx>↻ Repetir</button>':`<div class="ivctl"><button data-ivb aria-label="Fase anterior">⏮</button><button class="pri" data-ivp aria-label="Pausar o reanudar">${IV.running?'⏸':'▶'}</button><button data-ivn aria-label="Saltar fase">⏭</button></div>`}
<button class="ivrs" data-ivr>↻ Reiniciar (volver a 0:00)</button><button class="ivrs" data-ivc>Cambiar configuración</button>`}

<script id="ios-layer">
/* ===== ETAPA 1 · capa iOS: hojas animadas, deslizar para cerrar, transiciones, háptica, selección segura ===== */
(function(){'use strict';

let hl=null;const hsw=()=>{if(hl)return hl;hl=document.createElement('label');hl.setAttribute('aria-hidden','true');hl.style.cssText='position:fixed;left:-99px;top:-99px;opacity:0;pointer-events:none';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');hl.appendChild(i);document.body.appendChild(hl);return hl};

hook(M);if(typeof CM!=='undefined')hook(CM);

const _r=window.render;if(typeof _r==='function'){

['pointerdown','click','change'].forEach(n=>document.addEventListener(n,()=>{act=Date.now()},true));

window.SAN=function SAN(v){if(typeof v==='string')return v.replace(/[<>"`]/g,'').replace(/^\s*javascript:/i,'');if(Array.isArray(v))return v.map(SAN);if(v&&typeof v==='object'){const o={};for(const k in v){if(k==='__proto__'||k==='constructor')continue;o[SAN(k)]=SAN(v[k])}return o}return v};
