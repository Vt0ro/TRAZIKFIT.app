    <script>
      try {
        var raw = JSON.parse(localStorage.getItem('plan_v1') || '{}');
        var light = raw.theme === 'light';
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');

        if (m) m.content = light ? '#F6F2FC' : '#0A051A';
